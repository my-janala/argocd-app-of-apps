apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-workshop               # Name of the EKS cluster
  region: us-east-1                # AWS region where the cluster will be created
  version: "1.28"                  # Kubernetes version (supported by EKS)

vpc:
  cidr: 10.42.0.0/16               # CIDR block for the VPC
  subnets:
    private:
      us-east-1a:
        cidr: 10.42.1.0/24         # Private subnet (Control Plane & Worker Nodes) in a single AZ
    public:
      us-east-1a:
        cidr: 10.42.2.0/24         # Optional public subnet (for LB or NAT Gateway)

  # Uncomment below if you don't want to create any public subnets
  # publicAccessCIDRs: ["0.0.0.0/32"]  # Restrict public access if no LB is needed

iam:
  withOIDC: true                   # Enable IAM OIDC provider for IRSA (IAM Roles for Service Accounts)
  serviceAccounts:                 # Example service account configuration
    - metadata:
        name: custom-sa            # Replace with the actual service account name
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AWSLoadBalancerControllerPolicy  # IAM for ALB Controller

addons:
  - name: vpc-cni                  # Amazon VPC CNI plugin for Kubernetes
    version: 1.16.1                # Add-on version for custom networking
    configurationValues: >         # Configure custom networking for Pods
      {
        "useCustomPodCIDR": true,
        "enablePodENI": true,
        "env": [
          {"name": "WARM_ENI_TARGET", "value": "1"},
          {"name": "WARM_IP_TARGET", "value": "5"},
          {"name": "MINIMUM_IP_TARGET", "value": "5"}
        ]
      }

cloudWatch:
  clusterLogging:                  # Enable control plane logging
    enableTypes: ["audit", "api", "authenticator", "controllerManager", "scheduler"]

managedNodeGroups:
  - name: workers
    desiredCapacity: 3             # Node group desired size
    minSize: 2                     # Minimum number of nodes
    maxSize: 5                     # Maximum number of nodes
    instanceType: m5.large         # Worker node instance type
    privateNetworking: true        # Ensure worker nodes are created in private subnets
    labels:
      role: worker                 # Node label for scheduling